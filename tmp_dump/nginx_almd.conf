# 金融经营智能分析平台 — 统一门户（80端口，仅 IP 访问）
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 100M;

    root /var/www;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # ===== 设计预览 (login_design) =====
    location ^~ /design/ {
        alias /var/www/portal/;
        try_files $uri $uri/ =404;
    }

    # ===== 门户导航首页 =====
    location = / {
        root /var/www/portal;
        index index.html;
    }
    location = /index.html {
        root /var/www/portal;
    }

    # ===== ALMD 银行经营分析平台 =====
    location /almd/assets/ {
        root /var/www;
        expires 1h;
    }
    location /almd/ {
        root /var/www;
        try_files $uri $uri/ /almd/index.html;
    }
    location /almd/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /almd/reports-files/ {
        alias /opt/almd/reports/;
        internal;
    }

    # ===== IALMD 保险经营分析平台 =====
    location /ialmd/assets/ {
        root /var/www;
        expires 1h;
    }
    location /ialmd/ {
        root /var/www;
        try_files $uri $uri/ /ialmd/index.html;
    }
    location /ialmd/api/ {
        proxy_pass http://127.0.0.1:8002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # ===== ALMT 经营计划模拟系统 =====
    location /almt/assets/ {
        root /var/www;
        expires 1h;
    }
    location /almt/ {
        root /var/www;
        try_files $uri $uri/ /almt/index.html;
    }
    location /almt/api/curve/ {
        rewrite ^/almt/api/curve/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /almt/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
